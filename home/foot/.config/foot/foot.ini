# Port of ~/Old/Dots/wezterm/.config/wezterm/wezterm.lua.
# Tabs/splits/pane binds live in ~/.config/tmux/tmux.conf.

[main]
# Every foot window is its own tmux session (killed when the window closes).
shell=tmux
font=Fira Code:size=12,JetBrains Mono:size=12,Hack:size=12,monospace:size=12
pad=10x10
bold-text-in-bright=no

[cursor]
style=beam
blink=no

# Galizur, with the background forced to black like the wezterm config
[colors-dark]
alpha=0.7
foreground=ddeeff
background=000000
cursor=071317 ddeeff
selection-foreground=ddeeff
selection-background=071317

regular0=223344
regular1=aa1122
regular2=33aa11
regular3=ccaa22
regular4=2255cc
regular5=7755aa
regular6=22bbdd
regular7=8899aa
bright0=556677
bright1=ff1133
bright2=33ff11
bright3=ffdd33
bright4=3377ff
bright5=aa77ff
bright6=33ddff
bright7=bbccdd
