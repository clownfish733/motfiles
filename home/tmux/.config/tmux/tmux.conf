# Replaces the wezterm tab/pane keybinds (all ALT, no prefix needed).

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB"
set -g escape-time 0
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#{pane_title}"
set -g focus-events on
set -g history-limit 10000
# Closing the foot window kills its session, like closing a wezterm window.
set -g destroy-unattached on

# Tabs (windows)
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-w kill-window
bind -n M-n next-window
bind -n M-p previous-window

# Panes (M-v = top/bottom, M-s = side by side, same as wezterm)
bind -n M-v split-window -v -c "#{pane_current_path}"
bind -n M-s split-window -h -c "#{pane_current_path}"
bind -n M-q kill-pane

# Pane navigation
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane resizing
bind -n M-H resize-pane -L 3
bind -n M-J resize-pane -D 3
bind -n M-K resize-pane -U 3
bind -n M-L resize-pane -R 3

# Toggle foot opacity (OSC 11 with alpha, OSC 111 resets to foot.ini)
bind -n M-o if -F "#{@opaque}" \
    "set -u @opaque ; run -b 'printf \"\\033]111\\007\" > #{client_tty}'" \
    "set @opaque 1 ; run -b 'printf \"\\033]11;[100]#000000\\007\" > #{client_tty}'"

# Tab bar: hidden with a single window
set -g status off
set-hook -g window-linked   'if -F "#{==:#{session_windows},1}" "set status off" "set status on"'
set-hook -g window-unlinked 'if -F "#{==:#{session_windows},1}" "set status off" "set status on"'

set -g status-position top
set -g status-style "bg=#1a1a1a,fg=#ffffff"
set -g status-left ""
set -g status-right ""
setw -g window-status-format " #I #W "
setw -g window-status-current-format " #I #W "
setw -g window-status-style "bg=#1a1a1a,fg=#ffffff"
setw -g window-status-current-style "bg=#80bfff,fg=#00141d"
setw -g window-status-separator ""
set -g pane-border-style "fg=#1a1a1a"
set -g pane-active-border-style "fg=#80bfff"
